name: Deploy review preview

on:
  workflow_dispatch:
    inputs:
      lane_marker:
        description: Lane marker for the review copy; leave empty to remove it.
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build review copy
        env:
          LANE_MARKER: ${{ inputs.lane_marker }}
        run: |
          printf 'LANE_ID=lane-07\nLANE_MARKER=%s\nPORT=8787\n' "$LANE_MARKER" > .env
          pnpm start > rig.log 2>&1 &
          until curl --fail --silent http://localhost:8787/digest/2026-10-28 --output site.html; do sleep 1; done
          mkdir site
          mv site.html site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
